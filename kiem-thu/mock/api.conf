# Giả lập Backend API Gateway ở cổng 8080.
# Trả về JSON mô tả đúng những gì backend nhận được (URI, Host, IP kết nối, các header X-*).
server {
    listen 8080;
    listen [::]:8080;
    client_max_body_size 0;          # backend giả lập không tự giới hạn upload
    default_type application/json;
    add_header X-Served-By "api-gateway:8080" always;

    location = /api/products {
        alias /data/products.json;   # danh sách sản phẩm (~5KB) để thử nén gzip JSON
    }

    location / {
        return 200 '{"service":"api-gateway:8080","method":"$request_method","uri":"$request_uri","host":"$http_host","remote_addr":"$remote_addr","x_real_ip":"$http_x_real_ip","x_forwarded_for":"$http_x_forwarded_for","x_forwarded_proto":"$http_x_forwarded_proto","body_bytes":"$content_length"}\n';
    }
}
