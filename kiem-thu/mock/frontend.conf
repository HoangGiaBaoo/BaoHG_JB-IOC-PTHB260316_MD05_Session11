# Giả lập ứng dụng React (bản build) đang chạy ở cổng 3000
server {
    listen 3000;
    listen [::]:3000;
    root /usr/share/nginx/html;
    add_header X-Served-By "frontend-react:3000" always;

    location / {
        try_files $uri /index.html;   # SPA: /about, /products ... đều trả về index.html
    }
}
